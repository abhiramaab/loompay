name: Keep Render Services Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Services
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL is not configured."
            exit 1
          fi

          IFS=',' read -ra URLS <<< "$SERVICE_URL"
          for raw_url in "${URLS[@]}"; do
            url="$(echo "$raw_url" | xargs)"
            echo "Pinging $url to keep service awake..."
            # Wake up Render with 120s max-time. Any HTTP response resets Render's 15-minute sleep timer.
            HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 120 "$url" || true)
            echo "Response: $HTTP_STATUS - Service is active and awake!"
          done
          echo "Keep-alive ping completed."
