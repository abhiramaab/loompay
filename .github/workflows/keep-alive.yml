name: Keep Render Services Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier instances from sleeping (sleep threshold is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Services
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "⚠️ RENDER_SERVICE_URL is not configured yet."
            echo "Go to your GitHub repo -> Settings -> Secrets and variables -> Actions -> Add repository secret/variable 'RENDER_SERVICE_URL' with your Render URL."
            exit 0
          fi

          # Split by comma in case both frontend and backend URLs are provided
          IFS=',' read -ra URLS <<< "$SERVICE_URL"
          for raw_url in "${URLS[@]}"; do
            url=$(echo "$raw_url" | xargs)
            echo "Pinging $url ..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$url")
            echo "[$url] -> HTTP Status: $HTTP_STATUS"
          done
          echo "All active services pinged successfully!"
