<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoomPay">
  <defs>
    <linearGradient id="lp-needle" x1="22" y1="42" x2="46" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007AFF"/>
      <stop offset="1" stop-color="#3D9BFF"/>
    </linearGradient>
    <linearGradient id="lp-thread" x1="10" y1="12" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32ADE6"/>
      <stop offset="1" stop-color="#5AC8FA"/>
    </linearGradient>
    <mask id="lp-needle-mask">
      <rect x="0" y="0" width="64" height="64" fill="white"/>
      <ellipse cx="23.2" cy="40.4" rx="1.25" ry="2.5" transform="rotate(-36.5 23.2 40.4)" fill="black"/>
    </mask>
  </defs>

  <!-- Thread passes behind the needle eye, then sweeps to form the L foot. -->
  <path d="M9.5 10.5 C13 21 17.5 31 23.2 40.4 C26 46.5 31.5 50.5 38.5 51.6 C45.5 52.7 51.5 50.2 55 45.5"
        stroke="url(#lp-thread)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M55 45.5 C56.8 43.8 57.8 42 58.2 40.2"
        stroke="url(#lp-thread)" stroke-width="3.4" stroke-linecap="round" fill="none"/>

  <!-- Needle drawn over the thread, tapering to a sharp point (upper-right). -->
  <path d="M20.6 45.8 L22.2 41.5 L42.6 13.7 L46.2 10.2 L44.9 15.1 L24.5 43.2 Z"
        fill="url(#lp-needle)" mask="url(#lp-needle-mask)"/>
</svg>
