<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoomPay">
  <defs>
    <linearGradient id="kite-fill" x1="20" y1="8" x2="46" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#32ADE6"/>
    </linearGradient>
    <linearGradient id="kite-tail" x1="30" y1="30" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#32ADE6"/>
    </linearGradient>
  </defs>

  <!-- Kite body: a modern diamond with a single centre spine. -->
  <path d="M32 8 L49 27 L32 46 L15 27 Z" fill="url(#kite-fill)"/>
  <path d="M32 8 L32 46" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.3"/>

  <!-- Tail ribbon hanging from the bottom of the kite. -->
  <path d="M32 46 C35 50.5 30 53 33 57.5"
        stroke="url(#kite-tail)" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Two simple bows on the tail. -->
  <path d="M27.4 49.6 C29.6 48.6 31.4 49.4 32.9 51.2" stroke="url(#kite-tail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M36.6 50.4 C34.4 49.4 32.6 50.2 31.1 52" stroke="url(#kite-tail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M27.6 54.6 C29.8 53.6 31.6 54.4 33.1 56.2" stroke="url(#kite-tail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M36.8 55.4 C34.6 54.4 32.8 55.2 31.3 57" stroke="url(#kite-tail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- String trailing from the right corner. -->
  <path d="M49 27 C54 31 54.5 38 50.5 43"
        stroke="#0A84FF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
